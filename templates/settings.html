<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Settings — DeepPhish</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}"
    />
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
    <style>
      .settings-container {
        max-width: 800px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      .settings-section {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 30px;
        margin-bottom: 30px;
        box-shadow: 0 2px 8px var(--shadow);
      }

      .settings-section h3 {
        color: var(--text-primary);
        font-size: 1.5em;
        margin-bottom: 20px;
        border-bottom: 2px solid var(--border-color);
        padding-bottom: 10px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        margin-bottom: 5px;
        color: var(--text-tertiary);
        font-weight: 500;
      }

      .form-group input,
      .form-group select,
      .form-group textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        font-size: 1em;
        background: var(--bg-primary);
        color: var(--text-secondary);
      }

      .form-group textarea {
        resize: vertical;
        min-height: 100px;
      }

      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .checkbox-group input[type="checkbox"] {
        width: auto;
      }

      .btn {
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 1em;
        margin-right: 10px;
      }

      .btn-primary {
        background: var(--accent-color);
        color: white;
      }

      .btn-primary:hover {
        background: var(--accent-hover);
      }

      .btn-danger {
        background: rgba(245, 101, 101, 0.15);
        color: var(--error-color);
        border: 1px solid var(--error-color);
      }

      .alert {
        padding: 15px;
        border-radius: 4px;
        margin-bottom: 20px;
      }

      .alert-success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }

      .alert-error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }

      .threat-rules-list {
        margin-top: 20px;
      }

      .threat-rule-item {
        background: #f9f9f9;
        border: 1px solid #e0e0e0;
        border-radius: 4px;
        padding: 15px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .threat-rule-info {
        flex: 1;
      }

      .threat-rule-info strong {
        display: block;
        margin-bottom: 5px;
      }

      .threat-rule-actions {
        display: flex;
        gap: 10px;
      }

      .rule-badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 0.85em;
        margin-left: 10px;
      }

      .rule-whitelist {
        background: #d4edda;
        color: #155724;
      }

      .rule-blacklist {
        background: #f8d7da;
        color: #721c24;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <a href="/" style="text-decoration: none; color: inherit">
        <div class="logo-section">
          <div class="shield-icon">DP</div>
          <div class="logo-text">
            <h1>DeepPhish</h1>
            <p>Advanced Email Security Analysis</p>
          </div>
        </div>
      </a>
      <div class="header-actions">
        <button class="theme-toggle" id="themeToggle" title="Toggle theme">
          <span class="theme-toggle-icon" id="themeIcon">Dark</span>
        </button>
        <a href="/" class="header-btn">Home</a>
        <a href="/history" class="header-btn">History</a>
        <a href="/profile" class="header-btn">Profile</a>
        <a href="/dashboard" class="header-btn">Dashboard</a>
        <a href="/about" class="header-btn">About</a>
      </div>
    </div>

    <div class="settings-container">
      <h2 style="margin-bottom: 30px">Settings</h2>

      <div id="alertSection"></div>

      <!-- Notification Settings -->
      <div class="settings-section">
        <h3>Notification Settings</h3>
        <div class="form-group">
          <div class="checkbox-group">
            <input type="checkbox" id="emailNotifications" />
            <label for="emailNotifications"
              >Email notifications for high-risk detections</label
            >
          </div>
        </div>
        <div class="form-group">
          <div class="checkbox-group">
            <input type="checkbox" id="dailyReports" />
            <label for="dailyReports">Daily summary reports</label>
          </div>
        </div>
        <button class="btn btn-primary" onclick="saveNotificationSettings()">
          Save Notification Settings
        </button>
      </div>

      <!-- Threat Rules (Whitelist/Blacklist) -->
      <div class="settings-section">
        <h3>Threat Rules</h3>
        <p>
          Create custom rules to whitelist or blacklist specific URLs, domains,
          IPs, or keywords.
        </p>

        <div class="form-group">
          <label for="ruleType">Rule Type</label>
          <select id="ruleType">
            <option value="whitelist">Whitelist (Always Safe)</option>
            <option value="blacklist">Blacklist (Always Suspicious)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="ruleCategory">Category</label>
          <select id="ruleCategory">
            <option value="url">URL</option>
            <option value="domain">Domain</option>
            <option value="ip">IP Address</option>
            <option value="email">Email Address</option>
            <option value="keyword">Keyword</option>
          </select>
        </div>

        <div class="form-group">
          <label for="ruleValue">Value</label>
          <input
            type="text"
            id="ruleValue"
            placeholder="e.g., example.com, 192.168.1.1, suspicious-keyword"
          />
        </div>

        <div class="form-group">
          <label for="ruleDescription">Description (Optional)</label>
          <textarea
            id="ruleDescription"
            placeholder="Describe why this rule is needed..."
          ></textarea>
        </div>

        <button class="btn btn-primary" onclick="createThreatRule()">
          Create Rule
        </button>

        <!-- Existing Rules -->
        <div class="threat-rules-list" id="threatRulesList">
          <p>Loading rules...</p>
        </div>
      </div>

      <!-- Account Settings -->
      <div class="settings-section">
        <h3>Account Settings</h3>
        <div class="form-group">
          <label for="defaultAnalysisType">Default Analysis Type</label>
          <select id="defaultAnalysisType">
            <option value="full">Full Analysis</option>
            <option value="nlu">NLU Analysis Only</option>
            <option value="url">URL Analysis Only</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="saveAccountSettings()">
          Save Account Settings
        </button>
      </div>
    </div>

    <script>
      // Get auth token
      function getAuthToken() {
        return localStorage.getItem("access_token");
      }

      // Get auth headers
      function getAuthHeaders() {
        const headers = {
          "Content-Type": "application/json",
        };
        const token = getAuthToken();
        if (token) {
          headers["Authorization"] = `Bearer ${token}`;
        }
        return headers;
      }

      // Show alert
      function showAlert(message, type = "success") {
        const alertSection = document.getElementById("alertSection");
        alertSection.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
        setTimeout(() => {
          alertSection.innerHTML = "";
        }, 5000);
      }

      // Load settings
      async function loadSettings() {
        try {
          const response = await fetch("/api/profile", {
            method: "GET",
            headers: getAuthHeaders(),
          });

          if (response.ok) {
            const profile = await response.json();
            const preferences = profile.preferences || {};

            // Load notification settings
            document.getElementById("emailNotifications").checked =
              preferences.email_notifications !== false;
            document.getElementById("dailyReports").checked =
              preferences.daily_reports === true;

            // Load account settings
            document.getElementById("defaultAnalysisType").value =
              preferences.default_analysis_type || "full";
          }

          // Load threat rules
          loadThreatRules();
        } catch (error) {
          console.error("Error loading settings:", error);
        }
      }

      // Load threat rules
      async function loadThreatRules() {
        try {
          const response = await fetch("/api/threat-rules", {
            method: "GET",
            headers: getAuthHeaders(),
          });

          if (response.ok) {
            const data = await response.json();
            displayThreatRules(data.rules || []);
          }
        } catch (error) {
          console.error("Error loading threat rules:", error);
          document.getElementById("threatRulesList").innerHTML =
            "<p>Error loading rules. Please try again.</p>";
        }
      }

      // Display threat rules
      function displayThreatRules(rules) {
        const rulesList = document.getElementById("threatRulesList");

        if (rules.length === 0) {
          rulesList.innerHTML = "<p>No threat rules configured.</p>";
          return;
        }

        rulesList.innerHTML = rules
          .map(
            (rule) => `
          <div class="threat-rule-item">
            <div class="threat-rule-info">
              <strong>${rule.rule_value}
                <span class="rule-badge rule-${
                  rule.rule_type
                }">${rule.rule_type.toUpperCase()}</span>
              </strong>
              <div>${rule.rule_category} - ${
              rule.description || "No description"
            }</div>
            </div>
            <div class="threat-rule-actions">
              <button class="btn btn-danger" onclick="deleteThreatRule('${
                rule.id
              }')">Delete</button>
            </div>
          </div>
        `
          )
          .join("");
      }

      // Save notification settings
      async function saveNotificationSettings() {
        try {
          const preferences = {
            email_notifications:
              document.getElementById("emailNotifications").checked,
            daily_reports: document.getElementById("dailyReports").checked,
          };

          const response = await fetch("/api/profile", {
            method: "PUT",
            headers: getAuthHeaders(),
            body: JSON.stringify({ preferences }),
          });

          if (response.ok) {
            showAlert("Notification settings saved successfully!");
          } else {
            showAlert("Error saving notification settings", "error");
          }
        } catch (error) {
          console.error("Error:", error);
          showAlert("Error saving notification settings", "error");
        }
      }

      // Save account settings
      async function saveAccountSettings() {
        try {
          const preferences = {
            default_analysis_type: document.getElementById(
              "defaultAnalysisType"
            ).value,
          };

          const response = await fetch("/api/profile", {
            method: "PUT",
            headers: getAuthHeaders(),
            body: JSON.stringify({ preferences }),
          });

          if (response.ok) {
            showAlert("Account settings saved successfully!");
          } else {
            showAlert("Error saving account settings", "error");
          }
        } catch (error) {
          console.error("Error:", error);
          showAlert("Error saving account settings", "error");
        }
      }

      // Create threat rule
      async function createThreatRule() {
        const ruleType = document.getElementById("ruleType").value;
        const ruleCategory = document.getElementById("ruleCategory").value;
        const ruleValue = document.getElementById("ruleValue").value;
        const ruleDescription =
          document.getElementById("ruleDescription").value;

        if (!ruleValue) {
          showAlert("Please enter a rule value", "error");
          return;
        }

        try {
          const response = await fetch("/api/threat-rules", {
            method: "POST",
            headers: getAuthHeaders(),
            body: JSON.stringify({
              rule_type: ruleType,
              rule_category: ruleCategory,
              rule_value: ruleValue,
              description: ruleDescription,
            }),
          });

          if (response.ok) {
            showAlert("Threat rule created successfully!");
            document.getElementById("ruleValue").value = "";
            document.getElementById("ruleDescription").value = "";
            loadThreatRules();
          } else {
            const data = await response.json();
            showAlert(
              "Error creating rule: " + (data.error || "Unknown error"),
              "error"
            );
          }
        } catch (error) {
          console.error("Error:", error);
          showAlert("Error creating threat rule", "error");
        }
      }

      // Delete threat rule
      async function deleteThreatRule(ruleId) {
        if (!confirm("Are you sure you want to delete this rule?")) {
          return;
        }

        try {
          const response = await fetch(`/api/threat-rules/${ruleId}`, {
            method: "DELETE",
            headers: getAuthHeaders(),
          });

          if (response.ok) {
            showAlert("Threat rule deleted successfully!");
            loadThreatRules();
          } else {
            showAlert("Error deleting rule", "error");
          }
        } catch (error) {
          console.error("Error:", error);
          showAlert("Error deleting threat rule", "error");
        }
      }

      // Load settings on page load
      loadSettings();
    </script>
  </body>
</html>
