<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up — DeepPhish</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}"
    />
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
    <style>
      .auth-container {
        max-width: 450px;
        margin: 80px auto;
        padding: 40px;
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        box-shadow: 0 4px 20px var(--shadow);
      }

      .auth-container h1 {
        text-align: center;
        color: var(--text-primary);
        margin-bottom: 10px;
      }

      .auth-container p.subtitle {
        text-align: center;
        color: var(--text-tertiary);
        margin-bottom: 30px;
        font-size: 0.9em;
      }

      .auth-form {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .form-group label {
        color: var(--text-tertiary);
        font-weight: 500;
        font-size: 0.9em;
      }

      .form-group input {
        padding: 12px;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        font-size: 1em;
        background: var(--bg-primary);
        color: var(--text-secondary);
        transition: border-color 0.3s;
      }

      .form-group input:focus {
        outline: none;
        border-color: var(--accent-color);
      }

      .auth-btn {
        padding: 12px;
        background: var(--accent-color);
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 1em;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
      }

      .auth-btn:hover {
        background: var(--accent-hover);
        transform: translateY(-2px);
        box-shadow: 0 4px 12px var(--shadow-hover);
      }

      .auth-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .auth-error {
        padding: 12px;
        background: #fee;
        border: 1px solid #c53030;
        border-radius: 6px;
        color: #c53030;
        font-size: 0.9em;
        display: none;
      }

      .auth-error.show {
        display: block;
      }

      .auth-success {
        padding: 12px;
        background: #e8f5e9;
        border: 1px solid #2e7d32;
        border-radius: 6px;
        color: #2e7d32;
        font-size: 0.9em;
        display: none;
      }

      .auth-success.show {
        display: block;
      }

      .auth-links {
        text-align: center;
        margin-top: 20px;
        color: var(--text-tertiary);
      }

      .auth-links a {
        color: var(--accent-color);
        text-decoration: none;
        font-weight: 500;
      }

      .auth-links a:hover {
        text-decoration: underline;
      }

      .password-requirements {
        font-size: 0.85em;
        color: var(--text-tertiary);
        margin-top: -10px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <a href="/" style="text-decoration: none; color: inherit">
        <div class="logo-section">
          <div class="shield-icon">DP</div>
          <div class="logo-text">
            <h1>DeepPhish</h1>
            <p>Advanced Email Security Analysis</p>
          </div>
        </div>
      </a>
      <div class="header-actions">
        <button class="theme-toggle" id="themeToggle" title="Toggle theme">
          <span class="theme-toggle-icon" id="themeIcon">Dark</span>
        </button>
        <a href="/" class="header-btn">Home</a>
        <a href="/education" class="header-btn">Education</a>
        <a href="/about" class="header-btn">About</a>
      </div>
    </div>

    <div class="auth-container">
      <h1>Create Account</h1>
      <p class="subtitle">Sign up to use the DeepPhish extension</p>

      <div id="errorMessage" class="auth-error"></div>
      <div id="successMessage" class="auth-success"></div>

      <form id="signupForm" class="auth-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="your@email.com"
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            placeholder="••••••••"
            minlength="6"
          />
          <div class="password-requirements">
            Password must be at least 6 characters
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            required
            placeholder="••••••••"
          />
        </div>

        <button type="submit" class="auth-btn" id="signupBtn">Sign Up</button>
      </form>

      <div class="auth-links">
        <p>
          Already have an account?
          <a href="/login">Login</a>
        </p>
        <p style="margin-top: 10px">
          <a href="/">Back to Home</a>
        </p>
      </div>
    </div>

    <script>
      const signupForm = document.getElementById("signupForm");
      const errorMessage = document.getElementById("errorMessage");
      const successMessage = document.getElementById("successMessage");
      const signupBtn = document.getElementById("signupBtn");

      function showError(message) {
        errorMessage.textContent = message;
        errorMessage.classList.add("show");
        successMessage.classList.remove("show");
      }

      function showSuccess(message) {
        successMessage.textContent = message;
        successMessage.classList.add("show");
        errorMessage.classList.remove("show");
      }

      signupForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        signupBtn.disabled = true;
        signupBtn.textContent = "Creating account...";
        errorMessage.classList.remove("show");
        successMessage.classList.remove("show");

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const confirmPassword =
          document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {
          showError("Passwords do not match");
          signupBtn.disabled = false;
          signupBtn.textContent = "Sign Up";
          return;
        }

        if (password.length < 6) {
          showError("Password must be at least 6 characters");
          signupBtn.disabled = false;
          signupBtn.textContent = "Sign Up";
          return;
        }

        try {
          const response = await fetch("/api/auth/signup", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ email, password }),
          });

          const data = await response.json();

          if (response.ok) {
            showSuccess(
              "Account created! Please check your email to verify your account, then you can login."
            );

            // Redirect to login after 3 seconds
            setTimeout(() => {
              window.location.href = "/login";
            }, 3000);
          } else {
            showError(data.error || "Sign up failed. Please try again.");
            signupBtn.disabled = false;
            signupBtn.textContent = "Sign Up";
          }
        } catch (error) {
          showError("Network error. Please try again.");
          signupBtn.disabled = false;
          signupBtn.textContent = "Sign Up";
        }
      });

      // Check if already logged in
      if (localStorage.getItem("access_token")) {
        window.location.href = "/";
      }
    </script>
  </body>
</html>
