<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>DeepPhish Scanner</title>
    <link rel="stylesheet" href="styles/popup.css" />
  </head>
  <body>
    <div class="popup-container">
      <header class="popup-header">
        <h1>DeepPhish</h1>
        <p>Email Security Scanner</p>
      </header>

      <div class="popup-content">
        <div class="status-section">
          <div class="status-indicator" id="statusIndicator">
            <span class="status-dot"></span>
            <span id="statusText">Checking connection...</span>
          </div>
          <div class="auth-section">
            <div id="authStatusContainer" class="auth-status-container">
              <div>
                <div id="authStatus" class="auth-status">Checking...</div>
                <div id="userEmail" class="user-email"></div>
              </div>
              <div class="auth-buttons">
                <button id="loginBtn" class="auth-btn-small" style="display: none;">
                  Login
                </button>
                <button id="logoutBtn" class="auth-btn-small" style="display: none;">
                  Logout
                </button>
              </div>
            </div>
            
            <!-- Login Form (shown when not authenticated) -->
            <div id="loginFormContainer" class="login-form-container" style="display: none;">
              <form id="loginForm" class="login-form">
                <div class="form-group">
                  <label for="loginEmail">Email</label>
                  <input
                    type="email"
                    id="loginEmail"
                    name="email"
                    required
                    placeholder="your@email.com"
                    class="form-input"
                  />
                </div>
                <div class="form-group">
                  <label for="loginPassword">Password</label>
                  <input
                    type="password"
                    id="loginPassword"
                    name="password"
                    required
                    placeholder="••••••••"
                    class="form-input"
                  />
                </div>
                <div id="loginError" class="login-error" style="display: none;"></div>
                <button type="submit" id="loginSubmitBtn" class="login-submit-btn">
                  Login
                </button>
              </form>
            </div>
          </div>
        </div>

        <div class="stats-section">
          <div class="stat-card">
            <div class="stat-value" id="emailsScanned">0</div>
            <div class="stat-label">Emails Scanned</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="threatsFound">0</div>
            <div class="stat-label">Threats Found</div>
          </div>
        </div>

        <div class="actions-section">
          <button id="scanCurrentEmail" class="action-btn">
            Scan Current Email
          </button>
          <button id="viewProfile" class="action-btn secondary">
            Profile
          </button>
        </div>

        <div
          class="results-section hidden"
          id="resultsSection"
          style="display: block"
        >
          <h3>Latest Scan Results</h3>
          <div id="resultsContent"></div>
        </div>
      </div>
    </div>

    <script src="browser-polyfill.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
