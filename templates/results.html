<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Analysis Results — DeepPhish</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}"
    />
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
    <style>
      .results-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      .result-section {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 30px;
        margin-bottom: 30px;
        box-shadow: 0 2px 8px var(--shadow);
      }

      .result-section h3 {
        color: var(--text-primary);
        font-size: 1.5em;
        margin-bottom: 20px;
        border-bottom: 2px solid var(--border-color);
        padding-bottom: 10px;
      }

      .result-section h4 {
        color: var(--text-tertiary);
        font-size: 1.2em;
        margin-top: 20px;
        margin-bottom: 10px;
      }

      .risk-badge {
        display: inline-block;
        padding: 8px 16px;
        border-radius: 20px;
        font-weight: bold;
        margin: 10px 0;
      }

      .risk-high {
        background: rgba(245, 101, 101, 0.2);
        color: var(--error-color);
        border: 2px solid var(--error-color);
      }

      .risk-medium {
        background: rgba(255, 193, 7, 0.2);
        color: #f39c12;
        border: 2px solid #f39c12;
      }

      .risk-low {
        background: rgba(72, 187, 120, 0.2);
        color: var(--success-color);
        border: 2px solid var(--success-color);
      }

      .nlu-result {
        padding: 20px;
        border-radius: 8px;
        margin: 15px 0;
      }

      .nlu-phishing {
        background: rgba(245, 101, 101, 0.15);
        border: 2px solid var(--error-color);
        border-left: 6px solid var(--error-color);
      }

      .nlu-ham {
        background: rgba(72, 187, 120, 0.15);
        border: 2px solid var(--success-color);
        border-left: 6px solid var(--success-color);
      }

      .info-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
        margin: 15px 0;
      }

      .info-item {
        padding: 12px;
        background: var(--bg-tertiary);
        border: 1px solid var(--border-color);
        border-radius: 4px;
      }

      .info-item strong {
        display: block;
        color: var(--text-tertiary);
        font-size: 0.85em;
        margin-bottom: 5px;
      }

      .info-item span {
        color: var(--text-secondary);
        font-size: 1em;
        word-break: break-word;
      }

      .url-list,
      .ip-list {
        list-style: none;
        padding: 0;
        margin: 10px 0;
      }

      .url-list li,
      .ip-list li {
        padding: 8px;
        margin: 5px 0;
        background: var(--bg-tertiary);
        border: 1px solid var(--border-color);
        border-radius: 4px;
        font-family: monospace;
        font-size: 0.9em;
        color: var(--text-secondary);
      }

      .dnn-card {
        background: var(--bg-primary);
        border: 1px solid var(--border-color);
        border-radius: 14px;
        padding: 24px;
        margin: 18px 0;
        box-shadow: 0 25px 55px var(--shadow);
      }

      .dnn-card.safe {
        border-left: 4px solid #36cfc9;
      }

      .dnn-card.danger {
        border-left: 4px solid var(--error-color);
      }

      .dnn-card-head {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        flex-wrap: wrap;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        padding: 6px 14px;
        border-radius: 999px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        background: rgba(255, 255, 255, 0.08);
      }

      .dnn-card.danger .status-pill {
        background: rgba(245, 101, 101, 0.18);
        color: var(--error-color);
      }

      .dnn-card.safe .status-pill {
        background: rgba(54, 207, 201, 0.18);
        color: #36cfc9;
      }

      .dnn-card.danger .confidence-chip {
        color: var(--error-color);
      }

      .dnn-card.safe .confidence-chip {
        color: #36cfc9;
      }

      .confidence-chip {
        font-weight: 600;
        color: var(--text-primary);
      }

      .url-line {
        margin: 10px 0 0;
        font-family: "JetBrains Mono", SFMono-Regular, Menlo, monospace;
        word-break: break-all;
        color: var(--text-secondary);
      }

      .warning-panel {
        margin-top: 18px;
        padding: 16px;
        border-radius: 12px;
        background: rgba(245, 101, 101, 0.12);
        border: 1px solid rgba(245, 101, 101, 0.4);
      }

      .indicator-wrapper {
        margin-top: 18px;
      }

      .indicator-wrapper h4 {
        margin: 0 0 12px;
        color: var(--text-primary);
        font-size: 1em;
      }

      .indicator-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .indicator-list li {
        padding: 10px 14px;
        border-radius: 12px;
        background: var(--bg-tertiary);
        border-left: 3px solid var(--accent-color);
        color: var(--text-secondary);
      }

      .indicator-list li strong {
        color: var(--text-primary);
      }

      .indicator-list.danger li {
        border-left-color: var(--error-color);
      }
      .probabilities {
        margin-top: 12px;
        font-size: 0.9em;
        color: var(--text-secondary);
      }

      .indicator-list.safe li {
        border-left-color: #36cfc9;
      }

      .loading {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-secondary);
      }

      .spinner {
        border: 3px solid var(--bg-tertiary);
        border-top: 3px solid var(--accent-color);
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .error-message {
        background: rgba(245, 101, 101, 0.15);
        border: 1px solid var(--error-color);
        border-radius: 6px;
        padding: 15px;
        color: var(--error-color);
        margin: 20px 0;
      }

      .probability-bar {
        height: 20px;
        background: var(--bg-tertiary);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        overflow: hidden;
        margin: 5px 0;
        position: relative;
      }

      .probability-fill {
        height: 100%;
        transition: width 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 0.8em;
        font-weight: bold;
      }

      .probability-ham {
        background: var(--success-color);
      }

      .probability-phishing {
        background: var(--error-color);
      }

      .vt-stat-card {
        padding: 15px;
        background: white;
        border-radius: 6px;
        text-align: center;
        border: 2px solid;
      }

      .vt-stat-number {
        font-size: 2em;
        font-weight: bold;
        margin-bottom: 5px;
      }

      .vt-stat-label {
        font-size: 0.9em;
        color: #666;
      }

      .security-measures {
        margin-top: 20px;
        padding: 20px;
        background: #e8f4f8;
        border-radius: 8px;
        border-left: 4px solid #0369a1;
      }

      .security-measures h4 {
        margin-top: 0;
        color: #0369a1;
      }

      .security-measures ul {
        margin: 10px 0;
        padding-left: 20px;
        color: #555;
        line-height: 1.8;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <a href="/" style="text-decoration: none; color: inherit">
        <div class="logo-section">
          <div class="shield-icon">DP</div>
          <div class="logo-text">
            <h1>DeepPhish</h1>
            <p>Advanced Email Security Analysis</p>
          </div>
        </div>
      </a>
      <div class="header-actions">
        <button class="theme-toggle" id="themeToggle" title="Toggle theme">
          <span class="theme-toggle-icon" id="themeIcon">Dark</span>
        </button>
        <a href="/" class="header-btn">Home</a>
        <a href="/education" class="header-btn">Education</a>
        <a href="/about" class="header-btn">About</a>
      </div>
    </div>

    <div class="results-container">
      <div
        style="
          margin-bottom: 20px;
          display: flex;
          justify-content: space-between;
          align-items: center;
        "
      >
        <a href="/" class="header-btn">← Back to Home</a>
        <div
          id="exportButtons"
          style="display: none; gap: 10px; align-items: center"
        >
          <button
            class="header-btn"
            style="
              background: #667eea;
              color: white;
              border: none;
              padding: 8px 16px;
              border-radius: 4px;
              cursor: pointer;
              margin-left: 10px;
            "
            onclick="exportResults('json')"
          >
            Export JSON
          </button>
          <button
            class="header-btn"
            style="
              background: #c53030;
              color: white;
              border: none;
              padding: 8px 16px;
              border-radius: 4px;
              cursor: pointer;
              margin-left: 10px;
            "
            onclick="exportResults('pdf')"
          >
            Export PDF
          </button>
          <button
            class="header-btn"
            style="
              background: #0369a1;
              color: white;
              border: none;
              padding: 8px 16px;
              border-radius: 4px;
              cursor: pointer;
              margin-left: 10px;
            "
            onclick="exportResults('csv')"
          >
            Export CSV
          </button>
        </div>
      </div>

      <div id="loadingSection" class="loading">
        <div class="spinner"></div>
        <div>Loading analysis results...</div>
      </div>

      <div id="errorSection" style="display: none"></div>

      <div id="resultsContent" style="display: none">
        <!-- Results will be dynamically populated here -->
      </div>
    </div>

    <script>
      async function loadResults() {
        try {
          const response = await fetch("/api/last_result");
          const data = await response.json();

          document.getElementById("loadingSection").style.display = "none";

          if (data.error || data.message) {
            showError(data.error || data.message || "No results available");
            return;
          }

          displayResults(data);
          // Show export buttons if user is authenticated
          const token = localStorage.getItem("access_token");
          if (token) {
            document.getElementById("exportButtons").style.display = "flex";
          }
        } catch (error) {
          document.getElementById("loadingSection").style.display = "none";
          showError("Failed to load results: " + error.message);
        }
      }

      function showError(message) {
        const errorSection = document.getElementById("errorSection");
        errorSection.style.display = "block";
        errorSection.innerHTML = `<div class="error-message">${message}</div>`;
      }

      function displayResults(data) {
        const contentDiv = document.getElementById("resultsContent");
        contentDiv.style.display = "block";

        let html = "";

        // Risk Assessment Section (at the top)
        if (data.risk_assessment) {
          const risk = data.risk_assessment;
          const riskClass =
            risk.risk_level === "HIGH"
              ? "risk-high"
              : risk.risk_level === "MEDIUM"
              ? "risk-medium"
              : "risk-low";

          const isHighRisk = risk.risk_level === "HIGH" || risk.risk_level === "MEDIUM";
          html += `
          <div class="result-section">
            <h3>Risk Assessment</h3>
            <div class="risk-badge ${riskClass}">${risk.risk_level} RISK</div>
            <p><strong>Risk Score:</strong> ${risk.risk_score} / 1.0</p>
            ${
              risk.risk_factors && risk.risk_factors.length > 0
                ? `<h4>Risk Factors:</h4><ul>${risk.risk_factors
                    .map((f) => `<li>${f}</li>`)
                    .join("")}</ul>`
                : ""
            }
            <div style="margin-top: 15px; padding: 15px; background: var(--bg-tertiary); border-radius: 6px; border: 1px solid var(--border-color);">
              <strong>Recommendation:</strong> ${
                risk.recommendation || "No specific recommendation"
              }
            </div>
            ${isHighRisk ? `
            <div style="margin-top: 20px; padding: 20px; background: rgba(245, 101, 101, 0.15); border: 2px solid var(--error-color); border-radius: 8px; text-align: center;">
              <h4 style="color: var(--error-color); margin-top: 0;">Security Alert: Potential Threat Detected</h4>
              <p style="color: var(--text-secondary); margin-bottom: 15px;">Learn how to protect yourself from phishing attacks and recognize common threats.</p>
              <a href="/education" style="display: inline-block; padding: 12px 24px; background: var(--accent-color); color: white; text-decoration: none; border-radius: 6px; font-weight: 600; transition: background 0.2s;" onmouseover="this.style.background='var(--accent-hover)'" onmouseout="this.style.background='var(--accent-color)'">Learn About Phishing Protection →</a>
            </div>
            ` : ''}
          </div>`;
        }

        // NLU Analysis Section with Explainability
        if (data.nlu_analysis && !data.nlu_analysis.error) {
          const nlu = data.nlu_analysis;
          const isPhishing = nlu.is_phishing;
          const nluClass = isPhishing ? "nlu-phishing" : "nlu-ham";
          const probs = nlu.probabilities || {};
          const explainability = nlu.explainability || {};

              const showEducationLink = isPhishing && (nlu.confidence > 0.6 || probs.phishing > 0.6);
              html += `
          <div class="result-section">
            <h3>NLU Text Analysis</h3>
            <div class="nlu-result ${nluClass}">
              <h4>Classification: ${
                nlu.prediction || (isPhishing ? "PHISHING" : "HAM")
              }</h4>
              <p style="color: var(--text-secondary); font-size: 1.1em;"><strong style="color: var(--text-primary);">Confidence:</strong> ${(nlu.confidence * 100).toFixed(
                2
              )}%</p>
              ${showEducationLink ? `
              <div style="margin-top: 20px; padding: 20px; background: rgba(245, 101, 101, 0.2); border: 2px solid var(--error-color); border-radius: 8px; text-align: center;">
                <h4 style="color: var(--error-color); margin-top: 0; font-size: 1.3em;">Phishing Email Detected</h4>
                <p style="color: var(--text-secondary); margin-bottom: 15px; font-size: 1.05em;">This email shows characteristics of a phishing attempt. Learn how to identify and protect yourself from similar threats.</p>
                <a href="/education" style="display: inline-block; padding: 12px 24px; background: var(--accent-color); color: white; text-decoration: none; border-radius: 6px; font-weight: 600; transition: background 0.2s; font-size: 1em;" onmouseover="this.style.background='var(--accent-hover)'" onmouseout="this.style.background='var(--accent-color)'">Learn About Phishing Protection →</a>
              </div>
              ` : ''}
              
              <div style="margin-top: 15px;">
                <strong>Probability Breakdown:</strong>
                <div class="probability-bar">
                  <div class="probability-fill probability-ham" style="width: ${
                    (probs.ham || 0) * 100
                  }%">
                    ${
                      (probs.ham || 0) * 100 > 10
                        ? ((probs.ham || 0) * 100).toFixed(1) + "%"
                        : ""
                    }
                  </div>
                </div>
                <small>HAM: ${((probs.ham || 0) * 100).toFixed(2)}%</small>
                
                <div class="probability-bar" style="margin-top: 10px;">
                  <div class="probability-fill probability-phishing" style="width: ${
                    (probs.phishing || 0) * 100
                  }%">
                    ${
                      (probs.phishing || 0) * 100 > 10
                        ? ((probs.phishing || 0) * 100).toFixed(1) + "%"
                        : ""
                    }
                  </div>
                </div>
                <small>PHISHING: ${((probs.phishing || 0) * 100).toFixed(
                  2
                )}%</small>
              </div>
              
              <div style="margin-top: 25px; padding: 20px; background: rgba(245, 101, 101, 0.15); border: 2px solid var(--error-color); border-radius: 8px;">
                <h4 style="margin-top: 0; color: var(--error-color); font-size: 1.2em; margin-bottom: 15px;">What Makes This Email Malicious:</h4>
                ${
                  (explainability.top_concerns &&
                    explainability.top_concerns.length > 0) ||
                  (explainability.suspicious_phrases &&
                    explainability.suspicious_phrases.length > 0)
                    ? `
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px;">
                  ${(explainability.top_concerns || [])
                    .slice(0, 6)
                    .map(
                      (concern) => `
                    <div style="padding: 12px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 6px; border-left: 4px solid var(--error-color);">
                      <strong style="color: var(--error-color); font-size: 1.05em; display: block; margin-bottom: 5px;">"${
                        concern.word || concern.token || "Unknown"
                      }"</strong>
                      <p style="color: var(--text-secondary); margin: 5px 0; line-height: 1.5;">${
                        concern.explanation ||
                        "This word is flagged as suspicious"
                      }</p>
                      ${
                        concern.importance
                          ? `<span style="color: var(--text-tertiary); font-size: 0.85em;">Impact: ${(
                              concern.importance * 100
                            ).toFixed(1)}%</span>`
                          : ""
                      }
                    </div>`
                    )
                    .join("")}
                  ${
                    (!explainability.top_concerns ||
                      explainability.top_concerns.length === 0) &&
                    explainability.suspicious_phrases
                      ? explainability.suspicious_phrases
                          .slice(0, 6)
                          .map(
                            (phrase) => `
                    <div style="padding: 12px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 6px; border-left: 4px solid var(--error-color);">
                      <strong style="color: var(--error-color); font-size: 1.05em; display: block; margin-bottom: 5px;">"${
                        phrase.word || phrase.token || "Unknown"
                      }"</strong>
                      <p style="color: var(--text-secondary); margin: 5px 0;">This word is flagged as suspicious</p>
                      ${
                        phrase.importance
                          ? `<span style="color: var(--text-tertiary); font-size: 0.85em;">Impact: ${(
                              phrase.importance * 100
                            ).toFixed(1)}%</span>`
                          : ""
                      }
                    </div>`
                          )
                          .join("")
                      : ""
                  }
                </div>
                `
                    : isPhishing
                    ? `
                <div style="padding: 15px; background: var(--bg-primary); border-radius: 6px; border: 1px solid var(--border-color);">
                  <p style="color: var(--text-secondary); margin: 0 0 10px 0; line-height: 1.6;">
                    <strong style="color: var(--text-primary);">Pattern-Based Detection:</strong> While no specific suspicious words were identified, the overall content pattern, structure, and linguistic features suggest this is a phishing attempt. The AI model detected:
                  </p>
                  <ul style="margin-top: 10px; margin-left: 20px; color: var(--text-secondary);">
                    <li>Unusual urgency or pressure tactics</li>
                    <li>Suspicious email structure or formatting</li>
                    <li>Patterns consistent with known phishing campaigns</li>
                    <li>Linguistic markers that differ from legitimate communications</li>
                  </ul>
                </div>
                `
                    : ""
                }
              </div>
            </div>
          </div>`;
        }

        // Email Parsing Section
        if (data.email_parsing || data.parsed_eml) {
          const emailData = data.email_parsing || {};
          const headers = emailData.headers || data.parsed_eml?.header || {};

          html += `
          <div class="result-section">
            <h3>Email Details</h3>
            <div class="info-grid">
              ${
                headers.from
                  ? `<div class="info-item"><strong>From</strong><span>${headers.from}</span></div>`
                  : ""
              }
              ${
                headers.to
                  ? `<div class="info-item"><strong>To</strong><span>${headers.to}</span></div>`
                  : ""
              }
              ${
                headers.subject
                  ? `<div class="info-item"><strong>Subject</strong><span>${headers.subject}</span></div>`
                  : ""
              }
              ${
                headers.date
                  ? `<div class="info-item"><strong>Date</strong><span>${headers.date}</span></div>`
                  : ""
              }
              ${
                emailData.attachments_count !== undefined
                  ? `<div class="info-item"><strong>Attachments</strong><span>${emailData.attachments_count}</span></div>`
                  : ""
              }
            </div>
            ${
              emailData.email_preview || emailData.body || data.email_content
                ? `
            <div style="margin-top: 20px;">
              <h4 style="color: var(--text-primary); margin-bottom: 10px;">Email Preview:</h4>
              <div style="padding: 20px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 6px; font-family: 'Courier New', monospace; font-size: 0.95em; white-space: pre-wrap; color: var(--text-secondary); max-height: 400px; overflow-y: auto; line-height: 1.6;">${emailData.email_preview || emailData.body || data.email_content || 'No preview available'}</div>
            </div>
            `
                : ""
            }
          </div>`;
        }

        // URL & IP Extraction Section
        if (data.url_extraction) {
          const urlData = data.url_extraction;
          html += `
          <div class="result-section">
            <h3>URLs & IPs Found</h3>
            ${
              urlData.urls_found && urlData.urls_found.length > 0
                ? `
              <h4>URLs (${urlData.urls_found.length}):</h4>
              <ul class="url-list">
                ${urlData.urls_found.map((url) => `<li>${url}</li>`).join("")}
              </ul>
            `
                : "<p>No URLs found</p>"
            }
            
            ${
              urlData.ips_found && urlData.ips_found.length > 0
                ? `
              <h4>IP Addresses (${urlData.ips_found.length}):</h4>
              <ul class="ip-list">
                ${urlData.ips_found.map((ip) => `<li>${ip}</li>`).join("")}
              </ul>
            `
                : "<p>No IP addresses found</p>"
            }
          </div>`;
        }

        // DNN Analysis Section (from full analysis or direct URL analysis)
        if (data.dnn_analysis) {
          // Check if it's from full analysis (has detailed_results array)
          if (data.dnn_analysis.detailed_results) {
            const dnn = data.dnn_analysis;
            html += `
          <div class="result-section">
            <h3>DNN URL Analysis</h3>
            <p><strong>URLs Analyzed:</strong> ${dnn.urls_analyzed} | 
               <strong>Phishing Detected:</strong> ${dnn.phishing_detected}</p>
            
            ${dnn.detailed_results
              .map((result) => {
                if (result.error) {
                  return `<div class="warning-panel"><strong>${
                    result.url || "Unknown URL"
                  }:</strong> Error - ${result.error}</div>`;
                }

                const isPhishing = result.is_phishing;
                const cardType = isPhishing ? "danger" : "safe";
                const prediction =
                  result.prediction || (isPhishing ? "PHISHING" : "LEGITIMATE");
                const confidence = (result.confidence * 100).toFixed(2);

                let featuresHtml = "";
                if (
                  result.top_phishing_indicators &&
                  result.top_phishing_indicators.length > 0
                ) {
                  featuresHtml = `
                    <div class="indicator-wrapper">
                      <h4>Top Phishing Indicators</h4>
                      <ul class="indicator-list ${cardType}">
                        ${result.top_phishing_indicators
                          .map(
                            (feat) => `
                              <li>
                                <strong>${feat.feature}</strong>
                                <div>${feat.description || "Suspicious pattern detected"}</div>
                                ${
                                  typeof feat.contribution === "number"
                                    ? `<small>Impact score: ${feat.contribution.toFixed(
                                        3
                                      )}</small>`
                                    : ""
                                }
                              </li>
                            `
                          )
                          .join("")}
                      </ul>
                    </div>
                  `;
                }

                return `
                  <div class="dnn-card ${cardType}">
                    <div class="dnn-card-head">
                      <div>
                        <span class="status-pill">${prediction}</span>
                        <p class="url-line">${result.url || "Unknown"}</p>
                      </div>
                      <span class="confidence-chip">${confidence}% confidence</span>
                    </div>
                    ${
                      isPhishing && parseFloat(confidence) > 60
                        ? `
                        <div class="warning-panel">
                          <p style="margin: 0 0 10px 0;"><strong>Warning:</strong> This URL has been flagged as potentially malicious. Do not visit this link.</p>
                          <a href="/education" class="header-btn" style="display: inline-block; padding: 8px 16px; border-radius: 999px;">Learn About Safe Browsing →</a>
                        </div>
                      `
                        : ""
                    }
                    ${
                      result.probabilities
                        ? `
                        <div class="probabilities">
                          Legitimate ${(result.probabilities.legitimate * 100).toFixed(1)}% •
                          Phishing ${(result.probabilities.phishing * 100).toFixed(1)}%
                        </div>
                      `
                        : ""
                    }
                    ${featuresHtml}
                  </div>
                `;
              })
              .join("")}
          </div>`;
          } else {
            // Single DNN analysis result (from /analyze/url route)
            const dnn = data.dnn_analysis;
            if (!dnn.error) {
              const isPhishing = dnn.is_phishing;
              const cardType = isPhishing ? "danger" : "safe";
              const prediction =
                dnn.prediction || (isPhishing ? "PHISHING" : "LEGITIMATE");
              const confidence = (dnn.confidence * 100).toFixed(2);

              let indicatorSource =
                dnn.summary?.key_concerns ||
                dnn.top_phishing_indicators ||
                dnn.detailed?.top_phishing_indicators ||
                [];
              let featuresHtml = "";
              if (indicatorSource.length > 0) {
                featuresHtml = `
                  <div class="indicator-wrapper">
                    <h4>Key Indicators</h4>
                    <ul class="indicator-list ${cardType}">
                      ${indicatorSource
                        .map((indicator) => {
                          if (typeof indicator === "string") {
                            return `<li>${indicator}</li>`;
                          }
                          return `
                            <li>
                              <strong>${indicator.feature || indicator.name}</strong>
                              <div>${indicator.description || indicator.reason || ""}</div>
                              ${
                                indicator.value !== undefined
                                  ? `<small>Value observed: ${indicator.value}</small>`
                                  : ""
                              }
                            </li>
                          `;
                        })
                        .join("")}
                    </ul>
                  </div>
                `;
              }

              html += `
              <div class="result-section">
                <h3>DNN URL Analysis</h3>
                <div class="dnn-card ${cardType}">
                  <div class="dnn-card-head">
                    <div>
                      <span class="status-pill">${prediction}</span>
                      <p class="url-line">${dnn.url || data.url || "Unknown"}</p>
                    </div>
                    <span class="confidence-chip">${confidence}% confidence</span>
                  </div>
                  ${
                    dnn.probabilities
                      ? `
                    <div class="probabilities">
                      Legitimate ${(dnn.probabilities.legitimate * 100).toFixed(1)}% • 
                      Phishing ${(dnn.probabilities.phishing * 100).toFixed(1)}%
                    </div>
                  `
                      : ""
                  }
                  ${featuresHtml}
                </div>
              </div>`;
            } else {
              html += `
              <div class="result-section">
                <h3>DNN URL Analysis</h3>
                <div class="warning-panel">
                  <strong>Error:</strong> ${dnn.error}
                </div>
              </div>`;
            }
          }
        }

        // VirusTotal Analysis Section (from direct URL/IP analysis)
        if (data.vt_analysis && !data.vt_analysis.error) {
          const vt = data.vt_analysis;
          const stats = vt.last_analysis_stats || {};
          const totalEngines =
            (stats.harmless || 0) +
            (stats.malicious || 0) +
            (stats.suspicious || 0) +
            (stats.undetected || 0);

          const maliciousCount = stats.malicious || 0;
          const suspiciousCount = stats.suspicious || 0;
          const harmlessCount = stats.harmless || 0;
          const undetectedCount = stats.undetected || 0;

          // Determine risk level
          let riskLevel = "LOW";
          let riskColor = "#0369a1";
          if (maliciousCount > 0) {
            riskLevel = maliciousCount >= 3 ? "HIGH" : "MEDIUM";
            riskColor = maliciousCount >= 3 ? "#c53030" : "#f39c12";
          } else if (suspiciousCount > 0) {
            riskLevel = "MEDIUM";
            riskColor = "#f39c12";
          }

          html += `
          <div class="result-section">
            <h3>VirusTotal Security Analysis</h3>
            <div style="padding: 20px; background: ${
              maliciousCount > 0
                ? "rgba(245, 101, 101, 0.12)"
                : suspiciousCount > 0
                ? "rgba(250, 176, 5, 0.12)"
                : "rgba(79, 209, 197, 0.12)"
            }; border-radius: 12px; border: 1px solid var(--border-color); border-left: 4px solid ${riskColor}; margin-bottom: 20px;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h4 style="margin: 0; color: ${riskColor};">Risk Level: ${riskLevel}</h4>
                <span style="font-size: 0.9em; color: var(--text-tertiary);">${totalEngines} Security Engines Analyzed</span>
              </div>
              
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin: 20px 0;">
                <div style="padding: 15px; background: var(--bg-primary); border-radius: 10px; text-align: center; border: 1px solid rgba(197, 48, 48, 0.5);">
                  <div style="font-size: 2em; font-weight: bold; color: #c53030; margin-bottom: 5px;">${maliciousCount}</div>
                  <div style="font-size: 0.9em; color: var(--text-secondary);">Malicious</div>
                  ${
                    maliciousCount > 0
                      ? `<div style="font-size: 0.8em; color: #c53030; margin-top: 5px;">${(
                          (maliciousCount / totalEngines) *
                          100
                        ).toFixed(1)}%</div>`
                      : ""
                  }
                </div>
                
                <div style="padding: 15px; background: var(--bg-primary); border-radius: 10px; text-align: center; border: 1px solid rgba(243, 156, 18, 0.5);">
                  <div style="font-size: 2em; font-weight: bold; color: #f39c12; margin-bottom: 5px;">${suspiciousCount}</div>
                  <div style="font-size: 0.9em; color: var(--text-secondary);">Suspicious</div>
                  ${
                    suspiciousCount > 0
                      ? `<div style="font-size: 0.8em; color: #f39c12; margin-top: 5px;">${(
                          (suspiciousCount / totalEngines) *
                          100
                        ).toFixed(1)}%</div>`
                      : ""
                  }
                </div>
                
                <div style="padding: 15px; background: var(--bg-primary); border-radius: 10px; text-align: center; border: 1px solid rgba(3, 105, 161, 0.4);">
                  <div style="font-size: 2em; font-weight: bold; color: #0369a1; margin-bottom: 5px;">${harmlessCount}</div>
                  <div style="font-size: 0.9em; color: var(--text-secondary);">Harmless</div>
                  <div style="font-size: 0.8em; color: #0369a1; margin-top: 5px;">${(
                    (harmlessCount / totalEngines) *
                    100
                  ).toFixed(1)}%</div>
                </div>
                
                <div style="padding: 15px; background: var(--bg-primary); border-radius: 10px; text-align: center; border: 1px solid rgba(149, 165, 166, 0.4);">
                  <div style="font-size: 2em; font-weight: bold; color: #95a5a6; margin-bottom: 5px;">${undetectedCount}</div>
                  <div style="font-size: 0.9em; color: var(--text-secondary);">Undetected</div>
                  <div style="font-size: 0.8em; color: #95a5a6; margin-top: 5px;">${(
                    (undetectedCount / totalEngines) *
                    100
                  ).toFixed(1)}%</div>
                </div>
              </div>
              
              ${
                vt.ip
                  ? `
              <div style="margin-top: 15px; padding: 12px; background: var(--bg-primary); border-radius: 10px; border: 1px solid var(--border-color);">
                <strong>IP Address:</strong> <code style="font-family: 'JetBrains Mono', monospace; background: var(--bg-tertiary); padding: 2px 6px; border-radius: 4px; color: var(--text-primary);">${
                  vt.ip
                }</code>
                ${
                  vt.country
                    ? `<br><strong>Country:</strong> ${vt.country}`
                    : ""
                }
                ${
                  vt.as_owner
                    ? `<br><strong>AS Owner:</strong> ${vt.as_owner}`
                    : ""
                }
                ${vt.asn ? `<br><strong>ASN:</strong> ${vt.asn}` : ""}
                ${
                  vt.reputation !== undefined
                    ? `<br><strong>Reputation:</strong> ${vt.reputation}`
                    : ""
                }
              </div>
              `
                  : ""
              }
              
              ${
                maliciousCount > 0 && vt.last_analysis_results
                  ? `
              <div style="margin-top: 20px; padding: 15px; background: rgba(245, 101, 101, 0.12); border-radius: 10px; border: 1px solid rgba(245, 101, 101, 0.4);">
                <h4 style="margin-top: 0; color: #c53030;">Security Engines Flagging as Malicious:</h4>
                <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;">
                  ${Object.entries(vt.last_analysis_results)
                    .filter(([engine, result]) => result === "malicious")
                    .map(
                      ([engine]) =>
                        `<span style="padding: 5px 10px; background: var(--bg-primary); border-radius: 6px; border: 1px solid rgba(245, 101, 101, 0.4); font-size: 0.85em; color: #c53030;">${engine}</span>`
                    )
                    .join("")}
                </div>
              </div>
              `
                  : ""
              }
              
              ${
                suspiciousCount > 0 && vt.last_analysis_results
                  ? `
              <div style="margin-top: 15px; padding: 15px; background: rgba(250, 176, 5, 0.12); border-radius: 10px; border: 1px solid rgba(243, 156, 18, 0.4);">
                <h4 style="margin-top: 0; color: #f39c12;">Security Engines Flagging as Suspicious:</h4>
                <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;">
                  ${Object.entries(vt.last_analysis_results)
                    .filter(([engine, result]) => result === "suspicious")
                    .map(
                      ([engine]) =>
                        `<span style="padding: 5px 10px; background: var(--bg-primary); border-radius: 6px; border: 1px solid rgba(243, 156, 18, 0.4); font-size: 0.85em; color: #f39c12;">${engine}</span>`
                    )
                    .join("")}
                </div>
              </div>
              `
                  : ""
              }
            </div>
            
            <!-- Security Measures Information -->
            <div style="margin-top: 20px; padding: 20px; background: rgba(56, 189, 248, 0.12); border-radius: 12px; border-left: 4px solid var(--accent-color); border: 1px solid var(--border-color);">
              <h4 style="margin-top: 0; color: var(--accent-color);">Security Measures</h4>
              <p style="margin: 10px 0; color: var(--text-secondary); line-height: 1.6;">
                <strong>Your device is protected:</strong> This analysis was performed safely through VirusTotal's API. 
                Your device never directly connects to the suspicious IP address. All security checks are performed 
                server-side using VirusTotal's threat intelligence database, which aggregates data from ${totalEngines} 
                security vendors worldwide.
              </p>
              <ul style="margin: 10px 0; padding-left: 20px; color: var(--text-secondary); line-height: 1.8;">
                <li><strong>No Direct Connection:</strong> Your browser never accesses the IP address directly</li>
                <li><strong>Server-Side Analysis:</strong> All queries are made from our secure server to VirusTotal</li>
                <li><strong>Threat Intelligence:</strong> Results are based on VirusTotal's database of ${totalEngines} security engines</li>
                <li><strong>Safe Analysis:</strong> No files are downloaded, no connections are established to the suspicious IP</li>
              </ul>
            </div>
          </div>`;
        }

        // External Checks Section (legacy format from full analysis)
        if (data.external_checks) {
          const checks = data.external_checks;
          if (checks.ip_reports && checks.ip_reports.length > 0) {
            html += `
            <div class="result-section">
              <h3> VirusTotal Reports</h3>
              ${checks.ip_reports
                .map((report, idx) => {
                  if (report.error) {
                    return `<div style="padding: 10px; margin: 5px 0; background: rgba(245, 101, 101, 0.12); border-radius: 6px; border: 1px solid rgba(245, 101, 101, 0.4);">
                    <strong>${report.ip || report.url}:</strong> Error - ${
                      report.error
                    }
                  </div>`;
                  }
                  const vtData = report.report?.data?.attributes;
                  if (vtData) {
                    const stats = vtData.last_analysis_stats || {};
                    const totalEngines =
                      (stats.harmless || 0) +
                      (stats.malicious || 0) +
                      (stats.suspicious || 0) +
                      (stats.undetected || 0);
                    return `<div style="padding: 15px; margin: 10px 0; background: ${
                      stats.malicious > 0 ? "rgba(245, 101, 101, 0.15)" : "rgba(96, 165, 250, 0.15)"
                    }; border: 1px solid var(--border-color); border-radius: 6px;">
                    <strong style="color: var(--text-primary);">${report.ip || report.url}:</strong><br>
                    <div style="margin-top: 10px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;">
                      <div><strong style="color: var(--error-color);">Malicious:</strong> <span style="color: var(--text-secondary);">${
                        stats.malicious || 0
                      }</span></div>
                      <div><strong style="color: #f39c12;">Suspicious:</strong> <span style="color: var(--text-secondary);">${
                        stats.suspicious || 0
                      }</span></div>
                      <div><strong style="color: var(--accent-color);">Harmless:</strong> <span style="color: var(--text-secondary);">${
                        stats.harmless || 0
                      }</span></div>
                      <div><strong style="color: var(--text-tertiary);">Undetected:</strong> <span style="color: var(--text-secondary);">${
                        stats.undetected || 0
                      }</span></div>
                    </div>
                    <div style="margin-top: 10px; font-size: 0.9em; color: var(--text-tertiary);">Total Engines: ${totalEngines}</div>
                  </div>`;
                  }
                  return `<div style="padding: 10px; margin: 5px 0; background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-secondary);">
                   <strong style="color: var(--text-primary);">${
                     report.ip || report.url
                   }:</strong> No detailed report available
                 </div>`;
                })
                .join("")}
            </div>`;
          }
        }

        // Raw Data Section (collapsible)
        html += `
        <div class="result-section">
          <h3>Raw Analysis Data</h3>
          <details>
            <summary style="cursor: pointer; padding: 12px; background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: 4px; margin-bottom: 10px; color: var(--text-secondary); font-weight: 500; user-select: none;">
              ▼ Click to view raw JSON data
            </summary>
            <pre style="background: var(--bg-primary); padding: 20px; border: 1px solid var(--border-color); border-radius: 6px; overflow-x: auto; font-size: 0.9em; color: var(--text-secondary); line-height: 1.6; margin-top: 10px; max-height: 600px; overflow-y: auto; font-family: 'Courier New', monospace;">${JSON.stringify(
              data,
              null,
              2
            )}</pre>
          </details>
        </div>`;

        contentDiv.innerHTML = html;
      }

      // Get analysis ID from URL
      function getAnalysisIdFromURL() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get("analysis_id");
      }

      // Store current analysis ID
      let currentAnalysisId = null;

      // Export results
      async function exportResults(format) {
        const analysisId = getAnalysisIdFromURL() || currentAnalysisId;
        const token = localStorage.getItem("access_token");

        if (!token) {
          alert("Please log in to export analyses");
          window.location.href = "/login";
          return;
        }

        // If we have an analysis ID, export from database
        if (analysisId) {
          exportAnalysisById(analysisId, format);
          return;
        }

        // Otherwise, try to export from LAST_RESULT
        try {
          const response = await fetch("/api/last_result", {
            headers: {
              Authorization: `Bearer ${token}`,
            },
          });

          if (!response.ok) {
            throw new Error("Failed to get last result");
          }

          const data = await response.json();

          if (!data || Object.keys(data).length === 0 || data.message) {
            alert(
              "No analysis data available to export. Please run an analysis first."
            );
            return;
          }

          // Export directly from data
          await exportDataDirectly(data, format);
        } catch (error) {
          console.error("Export error:", error);
          alert("Export failed: " + error.message);
        }
      }

      // Export data directly (for LAST_RESULT)
      async function exportDataDirectly(data, format) {
        const token = localStorage.getItem("access_token");

        try {
          // Create a temporary analysis in database for export
          const response = await fetch("/api/export/temp", {
            method: "POST",
            headers: {
              Authorization: `Bearer ${token}`,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ data, format }),
          });

          if (!response.ok) {
            // Fallback: download as JSON
            if (format === "json") {
              const blob = new Blob([JSON.stringify(data, null, 2)], {
                type: "application/json",
              });
              const url = window.URL.createObjectURL(blob);
              const a = document.createElement("a");
              a.href = url;
              a.download = `analysis_${new Date().getTime()}.json`;
              document.body.appendChild(a);
              a.click();
              window.URL.revokeObjectURL(url);
              document.body.removeChild(a);
            } else {
              alert(
                "Please save the analysis to history first to export as PDF or CSV."
              );
            }
            return;
          }

          const blob = await response.blob();
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          const extension =
            format === "pdf" ? "pdf" : format === "csv" ? "csv" : "json";
          a.download = `analysis_${new Date().getTime()}.${extension}`;
          document.body.appendChild(a);
          a.click();
          window.URL.revokeObjectURL(url);
          document.body.removeChild(a);
        } catch (error) {
          console.error("Direct export error:", error);
          alert("Export failed: " + error.message);
        }
      }

      // Export analysis by ID
      async function exportAnalysisById(analysisId, format) {
        const token = localStorage.getItem("access_token");
        if (!token) {
          alert("Please log in to export analyses");
          window.location.href = "/login";
          return;
        }

        try {
          const response = await fetch(
            `/api/export/${analysisId}?format=${format}`,
            {
              method: "GET",
              headers: {
                Authorization: `Bearer ${token}`,
              },
            }
          );

          if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error || "Export failed");
          }

          // Get the blob data
          const blob = await response.blob();

          // Create download link
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;

          // Set filename based on format
          const extension =
            format === "pdf" ? "pdf" : format === "csv" ? "csv" : "json";
          a.download = `analysis_${analysisId.substring(0, 8)}.${extension}`;

          // Trigger download
          document.body.appendChild(a);
          a.click();

          // Cleanup
          window.URL.revokeObjectURL(url);
          document.body.removeChild(a);
        } catch (error) {
          console.error("Export error:", error);
          alert("Export failed: " + error.message);
        }
      }

      // Load results on page load
      const analysisId = getAnalysisIdFromURL();
      if (analysisId) {
        loadAnalysisById(analysisId);
      } else {
        loadResults();
      }

      // Load specific analysis by ID
      async function loadAnalysisById(analysisId) {
        try {
          const token = localStorage.getItem("access_token");
          if (!token) {
            document.getElementById("loadingSection").style.display = "none";
            document.getElementById("errorSection").style.display = "block";
            document.getElementById("errorSection").innerHTML = `
              <div class="error-message">
                <p>Please <a href="/login">log in</a> to view analysis details.</p>
              </div>
            `;
            return;
          }

          const response = await fetch(`/api/history/${analysisId}`, {
            headers: {
              Authorization: `Bearer ${token}`,
              "Content-Type": "application/json",
            },
          });

          if (!response.ok) {
            throw new Error("Failed to load analysis");
          }

          const analysis = await response.json();
          displayAnalysis(analysis);
          document.getElementById("exportButtons").style.display = "flex";
        } catch (error) {
          console.error("Error loading analysis:", error);
          document.getElementById("loadingSection").style.display = "none";
          document.getElementById("errorSection").style.display = "block";
          document.getElementById("errorSection").innerHTML = `
            <div class="error-message">
              <p>Error loading analysis: ${error.message}</p>
            </div>
          `;
        }
      }

      // Display analysis from database
      function displayAnalysis(analysis) {
        document.getElementById("loadingSection").style.display = "none";
        document.getElementById("resultsContent").style.display = "block";
        document.getElementById("exportButtons").style.display = "block";

        currentAnalysisId = analysis.id;
        const resultData = analysis.result_data || {};
        displayResults(resultData);
      }

      // Update displayResults to store analysis ID if available
      const originalDisplayResults = displayResults;
      displayResults = function (data) {
        if (data.analysis_id) {
          currentAnalysisId = data.analysis_id;
        }
        originalDisplayResults(data);
        // Show export buttons if authenticated (even without ID, we can export from LAST_RESULT)
        const token = localStorage.getItem("access_token");
        if (token) {
          const exportButtons = document.getElementById("exportButtons");
          if (exportButtons) {
            exportButtons.style.display = "flex";
          }
        }
      };
    </script>
  </body>
</html>
